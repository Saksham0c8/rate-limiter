# Port the app runs on
server.port=8080

# Redis settings (Spring Boot 3.x)
# For Spring Boot 2.x use spring.redis.host / spring.redis.port instead
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Rate limiter settings
# How many requests one user can make in one window
rate-limit.max-requests=5
# How long one window lasts, in seconds
rate-limit.window-seconds=60